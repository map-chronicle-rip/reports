<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Maintenance - chronicle.rip</title>
        <style>
            /* Apple-style minimalist CSS */
            body,
            html {
                height: 100%;
                margin: 0;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #ffffff;
                color: #1d1d1f;
                -webkit-font-smoothing: antialiased;
            }

            .container {
                text-align: center;
                padding: 20px;
                animation: fadeIn 1.2s ease-in-out;
            }

            .logo {
                font-size: 24px;
                font-weight: 600;
                letter-spacing: -0.5px;
                margin-bottom: 40px;
                display: block;
                text-decoration: none;
                color: #000;
            }

            /* If you have a physical logo file, use this instead of the text above */
            .logo img {
                max-width: 120px;
                height: auto;
            }

            h1 {
                font-size: 48px;
                font-weight: 600;
                letter-spacing: -0.015em;
                margin-bottom: 16px;
            }

            p {
                font-size: 19px;
                line-height: 1.47;
                font-weight: 400;
                color: #86868b;
                max-width: 400px;
                margin: 0 auto;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 768px) {
                h1 {
                    font-size: 32px;
                }
                p {
                    font-size: 17px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img
                src="https://map-chronicle-rip.github.io/maintenance/assets/images/chronicle_logo.svg"
            />

            <h1>We're making things better for you!</h1>

            <p>
                Thanks for your patience! While you wait, help yourself with our
                useful resources:
            </p>

            <p></p>

            <p>::CLOUDFLARE_ERROR_500S_BOX::</p>
        </div>
    </body>
</html>
